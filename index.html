<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For My Best Friend ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="opening">

            <div class="little-heart">💌</div>

            <p class="small-text">
                I made a little something...
            </p>

            <h1>
                For Someone<br>
                I'm Really Grateful For
            </h1>

            <p class="message">
                No special occasion.<br>
                No particular reason.<br><br>

                I just wanted to remind you that
                some friendships are worth
                being grateful for. 🫶
            </p>

            <button id="openButton">
                Open this 💛
            </button>

            <p class="hint">
                Made with a lot of memories ✨
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
